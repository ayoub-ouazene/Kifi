name: Continuous Integration

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # 1. Enforce style and docstrings for the backend package
      - name: Lint and Check Docstrings (Ruff / pydocstyle)
        run: |
          ruff check backend/auth backend/tests
          pydocstyle --convention=google backend/auth

      # 2. Run automated unit tests and enforce coverage
      - name: Run Pytest with Coverage
        run: |
          pytest --cov=backend/auth --cov-fail-under=80 backend/tests/