name: Continuous Integration

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.11

      # 1. Enforce style and docstrings for the backend package
      - name: Lint and Check Docstrings (Ruff / pydocstyle)
        working-directory: backend
        run: |
          uv run ruff check auth tests
          uv run pydocstyle --convention=google auth

      # 2. Run automated unit tests and enforce coverage
      - name: Run Pytest with Coverage
        working-directory: backend
        run: uv run pytest --cov=auth --cov-fail-under=80 tests/