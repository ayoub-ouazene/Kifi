name: Auto Create PR to Dev

on:
  push:
    branches-ignore:
      - dev
      - prod

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to compare branches correctly

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev # The target branch for the PR
          title: "Auto PR: ${{ github.ref_name }} -> dev"
          body: |
            Automated pull request from push to `${{ github.ref_name }}`.
            
            Please review the changes and ensure all CI checks pass before merging.
          draft: true # Optional: Creates a Draft PR by default
          labels: automated-pr